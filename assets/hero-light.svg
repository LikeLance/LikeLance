<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Zlance - design engineer, interfaces and systems">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#e6e6ea"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#ffffff"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- crop marks -->
  <g stroke="#71717a" stroke-opacity="0.45" stroke-width="1">
    <path d="M18 34 L18 18 L34 18" fill="none"/>
    <path d="M1166 18 L1182 18 L1182 34" fill="none"/>
    <path d="M18 266 L18 282 L34 282" fill="none"/>
    <path d="M1166 282 L1182 282 L1182 266" fill="none"/>
  </g>

  <!-- technical drawing mark -->
  <g transform="translate(1000,124)">
    <line x1="-132" y1="0" x2="132" y2="0" stroke="#71717a" stroke-opacity="0.32" stroke-dasharray="2 6"/>
    <line x1="0" y1="-124" x2="0" y2="124" stroke="#71717a" stroke-opacity="0.32" stroke-dasharray="2 6"/>
    <circle r="88" fill="none" stroke="#71717a" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="1 7"/>
    <g>
      <circle r="88" fill="none" stroke="#ff4d00" stroke-width="1.6" stroke-dasharray="74 479"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </g>
    <circle r="54" fill="none" stroke="#0b0b0f" stroke-opacity="0.26" stroke-width="1"/>
    <g stroke="#0b0b0f" stroke-opacity="0.26">
      <line x1="-96" y1="0" x2="-80" y2="0"/>
      <line x1="80" y1="0" x2="96" y2="0"/>
      <line x1="0" y1="-96" x2="0" y2="-80"/>
      <line x1="0" y1="80" x2="0" y2="96"/>
    </g>
    <circle r="3.2" fill="#ff4d00"/>
    <circle r="2" fill="#0b0b0f" fill-opacity="0.5">
      <animate attributeName="r" values="2;4.6;2" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.55;0.12;0.55" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="102" y="-62" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="10.5" fill="#71717a" letter-spacing="1.2">R54</text>
    <text x="102" y="84" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="10.5" fill="#71717a" letter-spacing="1.2">&#216;176</text>
  </g>

  <!-- index label -->
  <text x="62" y="52" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="12.5" fill="#71717a" letter-spacing="2.6">PROFILE / 2026 &#8212; MIANYANG, CN</text>

  <!-- name -->
  <text x="58" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif" font-size="96" font-weight="700" letter-spacing="-2" fill="#0b0b0f">ZLANCE</text>
  <rect x="424" y="80" width="11" height="58" rx="1.5" fill="#ff4d00">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- taglines -->
  <text x="62" y="180" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="17.5" fill="#0b0b0f" fill-opacity="0.86" letter-spacing="1.9">DESIGN ENGINEER &#8212; INTERFACES THAT SHIP</text>
  <text x="62" y="206" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13.5" fill="#71717a" letter-spacing="1.4">FROM MECHANICAL DRAWINGS TO PIXEL-EXACT UI</text>

  <!-- rule -->
  <line x1="62" y1="234" x2="1138" y2="234" stroke="#e4e4e9" stroke-width="1"/>
  <line x1="62" y1="234" x2="232" y2="234" stroke="#ff4d00" stroke-width="2"/>

  <!-- bottom strip -->
  <text x="62" y="270" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="12.5" fill="#71717a" letter-spacing="1.5">FOCUS &#8594; INTERFACES &#183; SYSTEMS &#183; MOTION</text>
  <text x="470" y="270" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="12.5" fill="#71717a" letter-spacing="1.5">METHOD &#8594; VANILLA-FIRST, NO BUILD STEP</text>
  <text x="1138" y="270" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="12.5" fill="#ff4d00" letter-spacing="1.5" text-anchor="end">OPEN TO WORK / 2027</text>
</svg>
